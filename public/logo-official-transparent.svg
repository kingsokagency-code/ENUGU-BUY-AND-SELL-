  <!-- 2. MIDDLE ROW: "— E N U G U —" -->
  <g id="EnuguSubBrand" transform="translate(0, 102)">
    <line x1="32" y1="0" x2="82" y2="0" stroke="#0A8F4F" stroke-width="2.2" stroke-linecap="round" />
    <text
