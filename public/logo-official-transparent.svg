      ENUGU
    </text>
    <line x1="218" y1="0" x2="268" y2="0" stroke="#0A8F4F" stroke-width="2.2" stroke-linecap="round" />
  </g>

  <!-- 3. BOTTOM ROW: "BUY • SELL • DISCOVER" -->
  <g id="BuySellDiscoverTagline" transform="translate(150, 122)">
    <text
      x="0"
      y="0"
      fill="#475569"
      font-family="'Poppins', 'Plus Jakarta Sans', system-ui, sans-serif"
      font-size="9"
      fontWeight="800"
      letter-spacing="0.26em"
