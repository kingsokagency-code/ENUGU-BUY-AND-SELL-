<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" fill="none">
  <defs>
    <!-- Emerald Bag Front Face Gradient -->
    <linearGradient id="bagFrontGrad" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stopColor="#22C55E" />
      <stop offset="25%" stopColor="#16A34A" />
      <stop offset="65%" stopColor="#087443" />
      <stop offset="100%" stopColor="#02381E" />
    </linearGradient>

    <!-- Emerald Bag Side Panel Gradient -->
    <linearGradient id="bagSideGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#15803D" />
      <stop offset="50%" stopColor="#065F38" />
      <stop offset="100%" stopColor="#012413" />
    </linearGradient>

    <!-- Tubular Bag Handle Gradient -->
    <linearGradient id="handleGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#4ADE80" />
      <stop offset="30%" stopColor="#22C55E" />
      <stop offset="70%" stopColor="#15803D" />
      <stop offset="100%" stopColor="#052E16" />
    </linearGradient>

    <!-- Gold Metallic Gradient -->
    <linearGradient id="goldMetallic" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#FEF08A" />
      <stop offset="30%" stopColor="#FACC15" />
      <stop offset="70%" stopColor="#EAB308" />
      <stop offset="100%" stopColor="#CA8A04" />
    </linearGradient>

    <!-- Orange Pin Gradient -->
    <linearGradient id="orangePinGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#FDBA74" />
      <stop offset="40%" stopColor="#FB923C" />
      <stop offset="80%" stopColor="#F97316" />
      <stop offset="100%" stopColor="#C2410C" />
    </linearGradient>

    <!-- Yellow Exchange Arrow Gradient -->
    <linearGradient id="yellowArrowGrad" x1="0" y1="0" x2="1" y2="0.8">
      <stop offset="0%" stopColor="#FEF08A" />
      <stop offset="35%" stopColor="#FBBF24" />
      <stop offset="75%" stopColor="#F59E0B" />
      <stop offset="100%" stopColor="#D97706" />
    </linearGradient>

    <!-- Green Exchange Arrow Gradient -->
    <linearGradient id="greenArrowGrad" x1="0" y1="1" x2="0.5" y2="0">
      <stop offset="0%" stopColor="#10B981" />
      <stop offset="50%" stopColor="#22C55E" />
      <stop offset="100%" stopColor="#86EFAC" />
    </linearGradient>

    <!-- 3D Bevel Gloss Top Highlight -->
    <linearGradient id="glossHighlight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stopColor="#FFFFFF" stopOpacity="0.8" />
      <stop offset="100%" stopColor="#FFFFFF" stopOpacity="0" />
    </linearGradient>

    <!-- Soft Drop Shadows -->
    <filter id="masterDropShadow" x="-10%" y="-10%" width="125%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="6" floodColor="#000000" floodOpacity="0.28" />
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- ======================================================== -->
  <!-- 1. 3D EMERALD SHOPPING BAG ICON (LEFT CLUSTER)           -->
  <!-- ======================================================== -->
  <g id="ShoppingBagGroup" transform="translate(10, 0)">
    
    <!-- Bag Handle -->
    <g id="BagHandle">
      <!-- Outer Tube -->
      <path
        d="M175 140 C175 45, 260 45, 260 140"
        stroke="url(#handleGrad)"
        strokeWidth="24"
        strokeLinecap="round"
        fill="none"
        filter="url(#masterDropShadow)"
      />
      <!-- Inner Tube Highlight -->
      <path
        d="M175 140 C175 52, 260 52, 260 140"
        stroke="#86EFAC"
        strokeWidth="5"
        strokeLinecap="round"
        fill="none"
        opacity="0.75"
      />
      <!-- Left Gold Attachment Ring -->
      <ellipse cx="175" cy="144" rx="14" ry="9" fill="url(#goldMetallic)" stroke="#854D0E" strokeWidth="2.5" />
      <ellipse cx="175" cy="144" rx="7" ry="4.5" fill="#052E16" />
      <!-- Right Gold Attachment Ring -->
      <ellipse cx="260" cy="144" rx="14" ry="9" fill="url(#goldMetallic)" stroke="#854D0E" strokeWidth="2.5" />
      <ellipse cx="260" cy="144" rx="7" ry="4.5" fill="#052E16" />
    </g>

    <!-- Bag Body 3D Perspective Shapes -->
    <g id="BagBody" filter="url(#masterDropShadow)">
      <!-- Left Perspective Side Panel -->
      <path
        d="M120 142 L160 142 L105 348 C100 365, 85 365, 75 350 L50 295 L120 142 Z"
        fill="url(#bagSideGrad)"
      />
      <!-- Main Front Face (Trapezoid with Rounded Base) -->
      <path
        d="M142 142 L295 142 L345 330 C352 355, 335 368, 308 368 L125 368 C98 368, 85 352, 95 330 L142 142 Z"
        fill="url(#bagFrontGrad)"
      />
      <!-- Top Rim Lip / Fold -->
      <path
        d="M142 142 L295 142 L290 156 L137 156 Z"
        fill="#86EFAC"
        opacity="0.6"
      />
      <!-- Front Face Right Bevel Edge -->
      <path
        d="M295 142 L345 330 C352 355, 335 368, 308 368 L296 368 L275 156 Z"
        fill="#044E29"
        opacity="0.4"
      />
      <!-- Top Left Specular Sheen -->
      <path
        d="M145 156 L205 156 L175 270 L125 270 Z"
        fill="url(#glossHighlight)"
        opacity="0.25"
      />
    </g>

    <!-- Green Exchange Arrow (Bottom-Right upward curve) -->
    <g id="GreenArrow">
      <path
        d="M260 340 C320 335, 345 285, 325 240"
        stroke="url(#greenArrowGrad)"
        strokeWidth="18"
        strokeLinecap="round"
        fill="none"
      />
      <!-- Green Arrowhead -->
      <polygon
        points="325,215 352,260 302,252"
        fill="#22C55E"
        stroke="#15803D"
        strokeWidth="2"
      />
      <!-- Green Arrowhead Highlight -->
      <polygon
        points="325,218 346,255 322,250"
        fill="#86EFAC"
        opacity="0.8"
      />
    </g>

    <!-- White Stylized Lowercase "e" -->
    <g id="LetterE" filter="url(#masterDropShadow)">
      <!-- 3D Base Drop Depth for "e" -->
      <path
        d="M235 200 C175 190, 115 220, 105 285 C95 345, 140 375, 205 372 C255 370, 280 345, 288 318 L242 318 C235 332, 215 342, 195 340 C158 335, 145 305, 148 280 L288 280 C290 245, 275 208, 235 200 Z M152 255 C158 230, 195 220, 235 225 C255 228, 264 242, 265 255 L152 255 Z"
        fill="#E2E8F0"
        transform="translate(2, 4)"
      />
      <!-- Main Crisp Pure White "e" Surface -->
      <path
        d="M235 200 C175 190, 115 220, 105 285 C95 345, 140 375, 205 372 C255 370, 280 345, 288 318 L242 318 C235 332, 215 342, 195 340 C158 335, 145 305, 148 280 L288 280 C290 245, 275 208, 235 200 Z M152 255 C158 230, 195 220, 235 225 C255 228, 264 242, 265 255 L152 255 Z"
        fill="#FFFFFF"
      />
      <!-- Upper Inner Eye Highlight -->
      <path
        d="M158 252 C162 235, 195 225, 232 230 C248 232, 258 242, 260 252 L158 252 Z"
        fill="#F8FAFC"
      />
    </g>

    <!-- Yellow / Gold Loop Arrow (Curving around bottom-left to front) -->
    <g id="YellowArrow" filter="url(#masterDropShadow)">
      <path
        d="M65 270 C30 300, 35 360, 95 372 C125 378, 155 365, 175 350"
        stroke="url(#yellowArrowGrad)"
        strokeWidth="20"
        strokeLinecap="round"
        fill="none"
      />
      <!-- Yellow Arrowhead -->
      <polygon
        points="195,340 148,335 162,375"
        fill="#F59E0B"
        stroke="#B45309"
        strokeWidth="2.5"
      />
      <!-- Yellow Arrowhead Gloss Highlight -->
      <polygon
        points="190,342 154,340 166,368"
        fill="#FEF08A"
        opacity="0.9"
      />
    </g>

    <!-- 3D Orange Location Pin (Resting on top-right of "e") -->
    <g id="LocationPin" transform="translate(262, 168)" filter="url(#masterDropShadow)">
      <!-- Outer Teardrop Base -->
      <path
        d="M32 0 C14.3 0, 0 14.3, 0 32 C0 55, 32 88, 32 88 C32 88, 64 55, 64 32 C64 14.3, 49.7 0, 32 0 Z"
        fill="url(#orangePinGrad)"
        stroke="#C2410C"
        strokeWidth="2"
      />
      <!-- Golden Inner Bevel Border -->
      <path
        d="M32 4 C16.5 4, 4 16.5, 4 32 C4 51, 32 80, 32 80 C32 80, 60 51, 60 32 C60 16.5, 47.5 4, 32 4 Z"
        fill="none"
        stroke="#FED7AA"
        strokeWidth="2"
        opacity="0.8"
      />
      <!-- Center Circle / Dot (White / Light Inner Core) -->
      <circle cx="32" cy="32" r="12" fill="#FFFFFF" stroke="#EA580C" strokeWidth="2" />
    </g>

  </g>

  <!-- ======================================================== -->
  <!-- 2. TYPOGRAPHY & BADGES CLUSTER (RIGHT SIDE)              -->
  <!-- ======================================================== -->
  <g id="TypographyGroup" transform="translate(395, 0)">
    
    <!-- "ENUGU" Bold 3D Wordmark -->
    <g id="WordmarkEnugu" filter="url(#masterDropShadow)">
      <!-- Shadow offset text -->
      <text
        x="0"
        y="182"
        fill="#00180C"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="112"
        font-weight="900"
        letter-spacing="0.03em"
      >
        ENUGU
      </text>
      <!-- Main Rich Forest Green text -->
      <text
        x="0"
        y="180"
        fill="#002D1E"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="112"
        font-weight="900"
        letter-spacing="0.03em"
      >
        ENUGU
      </text>
    </g>

    <!-- "BUY" Emerald Badge -->
    <g id="BuyBadge" transform="translate(0, 208)" filter="url(#masterDropShadow)">
      <!-- Main Pill Container -->
      <rect
        x="0"
        y="0"
        width="185"
        height="76"
        rx="22"
        fill="url(#bagFrontGrad)"
        stroke="#22C55E"
        strokeWidth="3.5"
      />
      <!-- Top Specular Highlight on Pill -->
      <rect
        x="6"
        y="4"
        width="173"
        height="32"
        rx="16"
        fill="url(#glossHighlight)"
        opacity="0.35"
      />
      <!-- "BUY" Text -->
      <text
        x="92.5"
        y="53"
        fill="#FFFFFF"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="46"
        font-weight="900"
        letter-spacing="0.08em"
        text-anchor="middle"
      >
        BUY
      </text>
    </g>

    <!-- "&" Ampersand Symbol Between Badges -->
    <g id="AmpersandSymbol" transform="translate(196, 222)">
      <text
        x="13"
        y="42"
        fill="#334155"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="36"
        font-weight="900"
        text-anchor="middle"
      >
        &amp;
      </text>
    </g>

    <!-- "SELL" Golden Yellow Badge -->
    <g id="SellBadge" transform="translate(232, 208)" filter="url(#masterDropShadow)">
      <!-- Main Pill Container -->
      <rect
        x="0"
        y="0"
        width="210"
        height="76"
        rx="22"
        fill="url(#yellowArrowGrad)"
        stroke="#FDE047"
        strokeWidth="3.5"
      />
      <!-- Top Specular Highlight on Pill -->
      <rect
        x="6"
        y="4"
        width="198"
        height="32"
        rx="16"
        fill="url(#glossHighlight)"
        opacity="0.5"
      />
      <!-- "SELL" Text -->
      <text
        x="105"
        y="53"
        fill="#002D1E"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="46"
        font-weight="900"
        letter-spacing="0.06em"
        text-anchor="middle"
      >
        SELL
      </text>
    </g>

    <!-- Small Golden Crown Below SELL Badge -->
    <g id="MiniCrown" transform="translate(322, 288)" filter="url(#masterDropShadow)">
      <path
        d="M0 24 L6 6 L15 16 L24 2 L33 16 L42 6 L48 24 Z"
        fill="url(#goldMetallic)"
        stroke="#B45309"
        strokeWidth="1.5"
      />
      <!-- Crown Base Band -->
      <rect x="0" y="24" width="48" height="6" rx="2" fill="#EAB308" stroke="#854D0E" strokeWidth="1" />
      <!-- Jewels -->
      <circle cx="6" cy="6" r="2.5" fill="#FEF08A" />
      <circle cx="24" cy="2" r="3" fill="#FEF08A" />
      <circle cx="42" cy="6" r="2.5" fill="#FEF08A" />
    </g>

    <!-- "— Powered by KINGSOK —" Sub-Brand Footer Lockup -->
    <g id="PoweredByKingsok" transform="translate(0, 335)">
      <!-- Left Rule -->
      <line x1="2" y1="12" x2="60" y2="12" stroke="#087443" strokeWidth="2" strokeLinecap="round" opacity="0.6" />
      
      <!-- Sub-Brand Typography -->
      <text
        x="72"
        y="18"
        fill="#087443"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="21"
        font-weight="800"
        letter-spacing="0.14em"
      >
        Powered by <tspan fill="#002D1E" font-weight="900">KINGSOK</tspan>
      </text>

      <!-- Right Rule -->
      <line x1="390" y1="12" x2="445" y2="12" stroke="#087443" strokeWidth="2" strokeLinecap="round" opacity="0.6" />
    </g>

  </g>

</svg>
