      ENUGU
    </text>
    <line x1="212" y1="0" x2="252" y2="0" stroke="#0A8F4F" stroke-width="1.75" stroke-linecap="round" />
  </g>

  <!-- 3. BOTTOM ROW: "BUY • SELL • DISCOVER" -->
  <g id="BuySellDiscoverTagline" transform="translate(140, 96)">
    <text
      x="0"
      y="0"
      fill="#6B7280"
      font-family="'Poppins', 'Plus Jakarta Sans', system-ui, sans-serif"
      font-size="7.5"
      font-weight="700"
      letter-spacing="0.28em"
      text-anchor="middle"
    >
      BUY &nbsp;•&nbsp; SELL &nbsp;•&nbsp; DISCOVER
    </text>
  </g>
